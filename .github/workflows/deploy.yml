name: CI/CD - Sistem Inventory & Supplier

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: self-hosted
    steps:
      # 1. Titik awal pengukuran
      - name: Start Deployment Timer
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "DEPLOYMENT CI/CD DIMULAI"
          Write-Host "START: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss.fff')"
          Write-Host "================================"

      # 2. Checkout kode sumber
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 4. Install backend dependencies
      - name: Install Backend Dependencies
        working-directory: ./BE-sistem-inventory
        run: npm ci

      # 5. Backend testing jika script tersedia
      - name: Run Backend Tests
        working-directory: ./BE-sistem-inventory
        run: npm test --if-present

      # 6. Install frontend dependencies
      - name: Install Frontend Dependencies
        working-directory: ./FE-sistem-inventory
        run: npm ci

      # 7. Frontend lint jika script tersedia
      - name: Run Frontend Lint
        working-directory: ./FE-sistem-inventory
        run: npm run lint --if-present

      # 8. Build frontend
      - name: Build Frontend
        working-directory: ./FE-sistem-inventory
        run: npm run build

      # 9. Stop aplikasi lama berdasarkan port khusus
      - name: Stop Previous Application
        shell: powershell
        run: |
          $ports = @(3000, 5173)
          foreach ($port in $ports) {
            $connections = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
            foreach ($connection in $connections) {
              Stop-Process -Id $connection.OwningProcess -Force -ErrorAction SilentlyContinue
            }
          }
          Start-Sleep -Seconds 2

      # 10. Start backend
      - name: Start Backend
        working-directory: ./BE-sistem-inventory
        shell: powershell
        run: |
          $env:RUNNER_TRACKING_ID = ""
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList "/c npm start > backend.log 2>&1" -WorkingDirectory "$PWD" -PassThru
          Write-Host "Backend process ID: $($process.Id)"

      # 11. Start frontend
      - name: Start Frontend
        working-directory: ./FE-sistem-inventory
        shell: powershell
        run: |
          $env:RUNNER_TRACKING_ID = ""
          $process = Start-Process -FilePath "cmd.exe" -ArgumentList "/c npm run preview -- --host 127.0.0.1 --port 5173 > frontend.log 2>&1" -WorkingDirectory "$PWD" -PassThru
          Write-Host "Frontend process ID: $($process.Id)"

      # 12. Tunggu aplikasi aktif
      - name: Wait For Application
        shell: powershell
        run: Start-Sleep -Seconds 12

      # 13. Sanity testing frontend
      - name: Sanity Check Frontend
        shell: powershell
        run: |
          $response = Invoke-WebRequest -Uri "http://localhost:5173" -UseBasicParsing -TimeoutSec 15
          if ($response.StatusCode -ne 200) {
            throw "Frontend gagal diakses"
          }
          Write-Host "Frontend OK: Status 200"

      # 14. Sanity testing backend
      - name: Sanity Check Backend
        shell: powershell
        run: |
          $response = Invoke-WebRequest -Uri "http://localhost:3000/api/health" -UseBasicParsing -TimeoutSec 15
          Write-Host "Backend merespons: Status $($response.StatusCode)"

      # 15. Titik akhir pengukuran
      - name: Finish Deployment Timer
        if: success()
        shell: powershell
        run: |
          Write-Host "================================"
          Write-Host "DEPLOYMENT CI/CD BERHASIL"
          Write-Host "STOP: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss.fff')"
          Write-Host "================================"
